# UGTF CI/CD Pipeline for Django on Google Cloud Run
name: Django CI/CD to Cloud Run

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  PROJECT_ID: top-cedar-471512-k3
  PROJECT_NUMBER: 30228073381
  REGION: us-west2
  SERVICE_NAME: menaskey
  SERVICE_URL: https://menaskey-30228073381.us-west2.run.app
  # link to analytics page
  # SERVICE_URL: https://menaskey-30228073381.us-west2.run.app/dashboard/

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/ugtf-github-pool/providers/github-actions
          service_account: github-runner-ugtf@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build and Push Docker Image
        id: build
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          echo "Building image: $IMAGE_TAG"
          docker build -t "$IMAGE_TAG" .
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
          docker push "$IMAGE_TAG"
          echo "image=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ steps.build.outputs.image }}
          wait: true

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed — rolling back to previous revision..."
          LAST_REVISION=$(gcloud run revisions list \
            --service=${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --limit=2 \
            --sort-by=~createTime \
            --format="value(metadata.name)" | tail -n 1)
          if [ -n "$LAST_REVISION" ]; then
            gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
              --region=${{ env.REGION }} \
              --to-revisions=$LAST_REVISION=100
          else
            echo "⚠️ No previous revision found — rollback skipped."
          fi

  # 2️⃣ Post-deploy health check
  health-check:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify Cloud Run deployment health
        run: |
          echo "Checking service health at ${{ env.SERVICE_URL }}..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.SERVICE_URL }})
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed (HTTP 200)"
              exit 0
            fi
            echo "Waiting for service... (status $STATUS)"
            sleep 5
          done
          echo "❌ Service did not become healthy in time."
          exit 1

   # 3️⃣ Lighthouse Performance and SEO Audit
  lighthouse-audit:
    needs: health-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # ensure full git history so lhci can get commit hash

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Run Lighthouse audit
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
          LHCI_BUILD_CONTEXT__GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Running Lighthouse audit on ${{ env.SERVICE_URL }}..."
          lhci autorun \
            --collect.url=${{ env.SERVICE_URL }} \
            --upload.target=temporary-public-storage \
            --assert.assertions="performance:warn" \
            --assert.assertions="accessibility:warn" \
            --assert.assertions="seo:warn"

  # 4️⃣ Python SEO Checker (replacement for seo-analyzer)
  seo-audit:
    needs: lighthouse-audit
    runs-on: ubuntu-latest
    steps:
      - name: Install Python SEO Checker
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip jq
          pip install seo-checker

      - name: Run SEO Checker
        run: |
          mkdir -p seo-reports
          echo "Running SEO check for ${{ env.SERVICE_URL }}..."
          seo-checker ${{ env.SERVICE_URL }} --format json > seo-reports/seo-report.json
          echo "✅ SEO report generated: seo-reports/seo-report.json"

      - name: Assert SEO Quality
        run: |
          echo "🔍 Checking for critical SEO issues..."
          BROKEN_LINKS=$(jq '.issues[] | select(.type == "broken_link") | length' seo-reports/seo-report.json | wc -l)
          MISSING_TITLES=$(jq '.issues[] | select(.type == "missing_title") | length' seo-reports/seo-report.json | wc -l)
          MISSING_META=$(jq '.issues[] | select(.type == "missing_meta_description") | length' seo-reports/seo-report.json | wc -l)

          echo "Broken links: $BROKEN_LINKS"
          echo "Missing titles: $MISSING_TITLES"
          echo "Missing meta descriptions: $MISSING_META"

          if [ "$BROKEN_LINKS" -gt 0 ] || [ "$MISSING_TITLES" -gt 0 ] || [ "$MISSING_META" -gt 0 ]; then
            echo "❌ SEO quality check failed."
            exit 1
          else
            echo "✅ SEO quality check passed."
          fi

      - name: Upload SEO Report
        uses: actions/upload-artifact@v4
        with:
          name: seo-report
          path: seo-reports/seo-report.json
