# UGTF CI/CD Pipeline for Django on Google Cloud Run
name: Django CI/CD to Cloud Run

on:
  # Trigger deployment whenever code is pushed (merged) to the the main branch
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    # No inputs needed, but this enables the button in the UI

# Define key variables for the pipeline
env:
  # 🚨 REPLACE WITH YOUR PROJECT ID (e.g., ugtf-production-2025)
  PROJECT_ID: top-cedar-471512-k3
  # 🚨 REPLACE WITH YOUR CLOUD RUN REGION (e.g., us-central1)
  GKE_REGION: us-west2
  # 🚨 REPLACE WITH YOUR CLOUD RUN SERVICE NAME (e.g., menaskey-web-app)
  SERVICE_NAME: github-runner-ugtf
  PROJECT_NUMBER: 30228073381

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # REQUIRED for Workload Identity Federation: Grants GitHub Runner permission to generate the OIDC token
    permissions:
      contents: 'read'
      id-token: 'write' 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      # 1. AUTHENTICATE TO GCP (KEYLESS VIA WIF)
      - name: Authenticate to GCP via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          # Path to the Identity Provider you created in the GCP Console
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/ugtf-github-pool/providers/github-actions
          # The Service Account the job will 'impersonate' (The one you granted the Service Account User role)
          service_account: github-runner-ugtf@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      # 2. Setup gcloud for Docker/Artifact Registry access
      - name: Set up gcloud and Auth
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          export_default_credentials: true
          
      # 3. Build and Push Container Image
      - name: Build and Push Docker Image
        run: |
          # Creates an image tag using Artifact Registry format
          IMAGE_TAG="${{ env.GKE_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          
          # Build the image using the Dockerfile
          docker build -t $IMAGE_TAG .
          
          # Push the final image to Google Artifact Registry
          docker push $IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          
      # 4. Deploy to Google Cloud Run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GKE_REGION }}
          image: ${{ env.IMAGE_TAG }}
          wait: true