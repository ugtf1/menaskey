# UGTF CI/CD Pipeline for Django on Google Cloud Run
name: Django CI/CD to Cloud Run

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  PROJECT_ID: top-cedar-471512-k3
  PROJECT_NUMBER: 30228073381
  REGION: us-west2
  SERVICE_NAME: menaskey
  SERVICE_URL: https://menaskey-30228073381.us-west2.run.app

jobs:
  # 1️⃣ Build and Deploy
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/ugtf-github-pool/providers/github-actions
          service_account: github-runner-ugtf@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build and Push Docker Image
        id: build
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          echo "Building image: $IMAGE_TAG"
          docker build -t "$IMAGE_TAG" .
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
          docker push "$IMAGE_TAG"
          echo "image=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ steps.build.outputs.image }}
          wait: true

  # 2️⃣ Health Check
  health-check:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify Cloud Run deployment health
        run: |
          echo "Checking service health at ${{ env.SERVICE_URL }}..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.SERVICE_URL }})
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed (HTTP 200)"
              exit 0
            fi
            echo "Waiting for service... (status $STATUS)"
            sleep 5
          done
          echo "❌ Service did not become healthy in time."
          exit 1

  # 3️⃣ Lighthouse Audit with Core Web Vitals
  lighthouse-audit:
    needs: health-check
    runs-on: ubuntu-latest
    outputs:
      lighthouse_summary: ${{ steps.summary.outputs.lighthouse_summary }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Run Lighthouse Audit
        run: |
          echo "Running Lighthouse CI against ${{ env.SERVICE_URL }}"
          mkdir -p .lighthouseci
          lhci collect --url=${{ env.SERVICE_URL }} --numberOfRuns=1 --outputPath=.lighthouseci --json || true

          echo "Generated files:"
          ls -R .lighthouseci || true

          # move the first JSON result to a known filename
          REPORT_FILE=$(find .lighthouseci -name "*.json" | head -n 1)
          if [ -z "$REPORT_FILE" ]; then
            echo "❌ No Lighthouse report JSON found!"
            exit 1
          fi
          cp "$REPORT_FILE" ./lighthouse-report.json
          cat ./lighthouse-report.json | jq '.' > ./lighthouse-report-pretty.json
          echo "✅ Lighthouse report ready: $REPORT_FILE"

      - name: Extract Lighthouse Scores and Core Web Vitals
        id: summary
        run: |
          echo "Extracting metrics from Lighthouse report..."
          PERFORMANCE=$(jq '.categories.performance.score' lighthouse-report.json)
          ACCESSIBILITY=$(jq '.categories.accessibility.score' lighthouse-report.json)
          BEST_PRACTICES=$(jq '.categories["best-practices"].score' lighthouse-report.json)
          SEO=$(jq '.categories.seo.score' lighthouse-report.json)

          LCP=$(jq '.audits["largest-contentful-paint"].numericValue' lighthouse-report.json)
          CLS=$(jq '.audits["cumulative-layout-shift"].numericValue' lighthouse-report.json)
          TBT=$(jq '.audits["total-blocking-time"].numericValue' lighthouse-report.json)

          SUMMARY="Performance: $PERFORMANCE | Accessibility: $ACCESSIBILITY | Best Practices: $BEST_PRACTICES | SEO: $SEO
          Core Web Vitals → LCP: ${LCP}ms | CLS: ${CLS} | TBT: ${TBT}ms"

          echo "lighthouse_summary=$SUMMARY" >> $GITHUB_OUTPUT
          echo "$SUMMARY"

      - name: Upload Lighthouse Report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: ./lighthouse-report-pretty.json


  # 4️⃣ Python SEO Audit
  seo-audit:
    needs: lighthouse-audit
    runs-on: ubuntu-latest
    outputs:
      issues_summary: ${{ steps.summary.outputs.issues_summary }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml jq

      - name: Run SEO Audit
        run: |
          python - <<'EOF'
          import requests, json
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          url = "${{ env.SERVICE_URL }}"
          print(f"🔍 Auditing {url} for SEO issues...")
          resp = requests.get(url, timeout=10)
          soup = BeautifulSoup(resp.text, "lxml")

          issues = []
          if not soup.title or not soup.title.string.strip():
              issues.append("Missing <title>")
          if not soup.find("meta", attrs={"name": "description"}):
              issues.append("Missing meta description")
          if not soup.find("h1"):
              issues.append("Missing <h1> tag")

          broken_links = []
          for a in soup.find_all("a", href=True):
              link = urljoin(url, a["href"])
              if link.startswith("tel:") or link.startswith("mailto:"):
                  continue
              try:
                  r = requests.head(link, allow_redirects=True, timeout=5)
                  if r.status_code >= 400:
                      broken_links.append(link)
              except Exception:
                  broken_links.append(link)
          if broken_links:
              issues.append(f"{len(broken_links)} broken links found")

          report = {
              "url": url,
              "issues": issues,
              "broken_links": broken_links,
              "total_issues": len(issues)
          }

          with open("seo-results.json", "w") as f:
              json.dump(report, f, indent=2)

          print(f"✅ SEO audit complete: {len(issues)} issues found.")
          EOF

      - name: Generate SEO Summary
        id: summary
        run: |
          SUMMARY=$(jq -r '.issues[:3] | join(", ")' seo-results.json)
          echo "issues_summary=$SUMMARY" >> $GITHUB_OUTPUT

      - name: Upload SEO Report
        uses: actions/upload-artifact@v4
        with:
          name: seo-results
          path: seo-results.json

  # 5️⃣ Email Notification
  notify:
    needs: [lighthouse-audit, seo-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Download Reports
        uses: actions/download-artifact@v4
        with:
          name: seo-results
      - name: Download Lighthouse Report
        uses: actions/download-artifact@v4
        with:
          name: lighthouse-report

      - name: Send Email Summary
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "🚀 UGTF CI/CD Report: ${{ env.SERVICE_NAME }} Deployment Results"
          to: ono@ugtf.org
          from: UGTF CI Bot
          body: |
            ✅ Deployment completed for *${{ env.SERVICE_NAME }}*

            🌍 URL: ${{ env.SERVICE_URL }}

            **📊 Lighthouse Summary**
            ${{ needs.lighthouse-audit.outputs.lighthouse_summary }}

            **🧩 SEO Summary**
            ${{ needs.seo-audit.outputs.issues_summary }}

            📎 Full reports attached.
          attachments: |
            seo-results.json
            lighthouse-report-pretty.json
