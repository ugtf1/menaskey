# UGTF CI/CD Pipeline for Django on Google Cloud Run
name: Django CI/CD to Cloud Run

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  PROJECT_ID: top-cedar-471512-k3
  PROJECT_NUMBER: 30228073381
  REGION: us-west2
  SERVICE_NAME: menaskey

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      # 1️⃣ Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2️⃣ Authenticate to GCP via WIF (no secrets)
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/ugtf-github-pool/providers/github-actions
          service_account: github-runner-ugtf@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      # 3️⃣ Set up the Google Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # 4️⃣ (Optional) Verify authentication context
      - name: Verify GCP Authentication
        run: |
          echo "Current account:"
          gcloud auth list
          echo "Active project:"
          gcloud config get-value project

      # 5️⃣ Build and Push Docker Image to Artifact Registry
      - name: Build and Push Docker Image
        id: build
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          echo "Building image: $IMAGE_TAG"

          # Build the image
          docker build -t "$IMAGE_TAG" .

          # Authenticate Docker with GCP Artifact Registry
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

          # Push the image
          docker push "$IMAGE_TAG"

          # Export image tag as job output
          echo "image=$IMAGE_TAG" >> $GITHUB_OUTPUT

      # 6️⃣ Deploy to Cloud Run
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ steps.build.outputs.image }}
          wait: true

      # 7️⃣ Rollback if deployment fails (optional safety net)
      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed — rolling back to previous revision..."
          LAST_REVISION=$(gcloud run revisions list \
            --service=${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --limit=2 \
            --sort-by=~createTime \
            --format="value(metadata.name)" | tail -n 1)

          if [ -n "$LAST_REVISION" ]; then
            echo "Rolling back to revision: $LAST_REVISION"
            gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
              --region=${{ env.REGION }} \
              --to-revisions=$LAST_REVISION=100
          else
            echo "⚠️ No previous revision found — rollback skipped."
          fi

      # 8️⃣ (Optional cleanup, auto-run by GitHub)
      - name: Post Authenticate to Google Cloud
        if: always()
        run: echo "Cleaned up credentials."

