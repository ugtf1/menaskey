# UGTF CI/CD Pipeline for Django on Google Cloud Run
name: Django CI/CD to Cloud Run

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  PROJECT_ID: top-cedar-471512-k3
  PROJECT_NUMBER: 30228073381
  REGION: us-west2
  SERVICE_NAME: menaskey
  SERVICE_URL: https://menaskey-30228073381.us-west2.run.app

jobs:
  # 1️⃣ Build and Deploy
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/ugtf-github-pool/providers/github-actions
          service_account: github-runner-ugtf@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build and Push Docker Image
        id: build
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          echo "Building image: $IMAGE_TAG"
          docker build -t "$IMAGE_TAG" .
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
          docker push "$IMAGE_TAG"
          echo "image=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ steps.build.outputs.image }}
          wait: true

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed — rolling back to previous revision..."
          LAST_REVISION=$(gcloud run revisions list \
            --service=${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --limit=2 \
            --sort-by=~createTime \
            --format="value(metadata.name)" | tail -n 1)
          if [ -n "$LAST_REVISION" ]; then
            gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
              --region=${{ env.REGION }} \
              --to-revisions=$LAST_REVISION=100
          else
            echo "⚠️ No previous revision found — rollback skipped."
          fi

  # 2️⃣ Post-deploy health check
  health-check:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify Cloud Run deployment health
        run: |
          echo "Checking service health at ${{ env.SERVICE_URL }}..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.SERVICE_URL }})
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed (HTTP 200)"
              exit 0
            fi
            echo "Waiting for service... (status $STATUS)"
            sleep 5
          done
          echo "❌ Service did not become healthy in time."
          exit 1

  # 3️⃣ Lighthouse Performance and SEO Audit
  lighthouse-audit:
    needs: health-check
    runs-on: ubuntu-latest
    outputs:
      lighthouse_url: ${{ steps.lhci.outputs.lighthouse_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Run Lighthouse audit
        id: lhci
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
          LHCI_BUILD_CONTEXT__GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Running Lighthouse audit on ${{ env.SERVICE_URL }}..."
          lhci autorun \
            --collect.url=${{ env.SERVICE_URL }} \
            --upload.target=temporary-public-storage \
            --assert.assertions="performance:warn" \
            --assert.assertions="accessibility:warn" \
            --assert.assertions="seo:warn" \
            | tee lighthouse-results.txt

  # 4️⃣ Python SEO Analyzer
  seo-audit:
    needs: lighthouse-audit
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SEO Analyzer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install seoanalyzer beautifulsoup4 requests jq

      - name: Run SEO Analysis
        run: |
          python - <<'EOF'
          from seoanalyzer import analyze
          import json
          url = "${{ env.SERVICE_URL }}"
          print(f"🔍 Running SEO analysis for {url} ...")
          results = analyze(url)
          with open("seo-results.json", "w") as f:
              json.dump(results, f, indent=2)
          print(f"✅ SEO analysis complete — found {len(results)} issues.")
          EOF

      - name: Assert SEO Quality
        run: |
          ISSUES=$(jq '. | length' seo-results.json)
          echo "SEO issues found: $ISSUES"
          if [ "$ISSUES" -gt 20 ]; then
            echo "❌ Too many SEO issues!"
            exit 1
          else
            echo "✅ SEO quality within threshold."
          fi

      - name: Upload SEO Report
        uses: actions/upload-artifact@v4
        with:
          name: seo-analysis-results
          path: seo-results.json

  # 5️⃣ Email summary notification
  notify:
    needs: [lighthouse-audit, seo-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Send Email Report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "🚀 UGTF CI/CD Report: ${{ env.SERVICE_NAME }} Deployment Results"
          to: ono@ugtf.org
          from: UGTF CI Bot
          body: |
            ✅ Deployment completed for *${{ env.SERVICE_NAME }}*

            🌍 URL: ${{ env.SERVICE_URL }}
            🕵️ Lighthouse Report: Performance, Accessibility, and SEO metrics
            🧠 SEO Analyzer: See attached report for issues and metadata insights.

            Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Attach SEO Report
        uses: actions/download-artifact@v4
        with:
          name: seo-analysis-results